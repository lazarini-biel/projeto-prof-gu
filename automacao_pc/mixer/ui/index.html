<!doctype html>
<html lang="pt-BR">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPARTA // MIXER</title>
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<div class="scanlines" aria-hidden="true"></div>

<header class="topo">

  <div class="estado-eqapo" id="estado-eqapo"></div>
  <div class="janela-botoes">
    <button id="bt-atualizar" title="Atualizar">↻</button>
    <button id="bt-tela-cheia" title="Tela cheia (F11)">⛶</button>
    <button id="bt-sair" class="fechar" title="Fechar">✕</button>
  </div>
</header>

<div id="banner" class="banner escondido"></div>

<main class="mesa" id="mesa"></main>

<footer class="rodape" id="rodape">SPARTA // mixer de volume</footer>

<div id="avisos" class="avisos" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
